name: CI

# Behaviour suites are shared by all three systems. Native graphics/audio API contracts
# run on a real device per OS and are required: a runner that cannot create the device
# fails its job instead of passing with a silent skip (THSSS_REQUIRE_NATIVE_API=1).
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  THSSS_REQUIRE_NATIVE_API: "1"
  THSSS_TEST_ROOT: ${{ github.workspace }}

jobs:
  linux:
    name: Linux (GL, Vulkan, OpenAL, native API contracts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install shared, DejaGnu and graphics tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dejagnu expect tcl \
            xvfb libgl1-mesa-dri libglx-mesa0 libgl1 \
            glslang-tools spirv-tools mesa-vulkan-drivers vulkan-tools \
            libopenal1 openal-tools libsdl2-2.0-0 \
            build-essential cmake ninja-build git
          # SPIRV-Cross has no Ubuntu package; build only its CLI for the Metal contract.
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git "$RUNNER_TEMP/spirv-cross"
          cmake -S "$RUNNER_TEMP/spirv-cross" -B "$RUNNER_TEMP/spirv-cross/build" \
            -G Ninja -DSPIRV_CROSS_CLI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/spirv-cross/build" --target spirv-cross
          echo "$RUNNER_TEMP/spirv-cross/build" >> "$GITHUB_PATH"

      - name: Behaviour suites (shared, including windowed resize per renderer)
        env:
          ALSOFT_DRIVERS: null
        run: xvfb-run -a sh tools/run-behavior-regressions.sh

      - name: Rendering suites (OpenGL and Vulkan)
        env:
          ALSOFT_DRIVERS: null
        run: xvfb-run -a sh tools/run-shader-regressions.sh

      - name: Real OpenGL and OpenAL device contract
        env:
          ALSOFT_DRIVERS: null
        run: xvfb-run -a dotnet run --project tests/NativeApiCompatibility/NativeApiCompatibility.csproj -p:WarningLevel=0

      - name: Audio suites (OpenAL loopback and backend contracts)
        env:
          ALSOFT_DRIVERS: null
        run: sh tools/run-audio-regressions.sh

      - name: Metal drawable API contract, AudioQueue contract and shader translation
        run: sh tools/run-mac-regressions.sh

      - name: Publish package with MSL cache for the Mac job
        run: |
          dotnet publish src/THSSS.csproj -r osx-arm64 --self-contained false -p:WarningLevel=0 -o "$RUNNER_TEMP/mac-dist"
          sh tools/export-metal-shaders.sh "$RUNNER_TEMP/mac-dist"
          ls "$RUNNER_TEMP/mac-dist/MetalShaders" | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-reports
          path: |
            /tmp/tmp.*/**/*.sum
            /tmp/tmp.*/**/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-dist-from-linux
          path: ${{ runner.temp }}/mac-dist
          if-no-files-found: ignore

  windows:
    name: Windows (build, XAudio2 and Win32 native contracts)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DejaGnu and Vulkan tooling
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S --needed dejagnu expect tcl make"
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install vulkan-sdk glslang -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK | Select-Object -Last 1 -ExpandProperty FullName
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Behaviour suites
        shell: bash
        run: sh tools/run-behavior-regressions.sh

      - name: Native XAudio2 and Win32 contract
        run: dotnet run --project tests/NativeApiCompatibility/NativeApiCompatibility.csproj -p:WarningLevel=0

      - name: Publish Windows audio contract host for the Wine job
        run: |
          dotnet publish tests/AudioBackendCompatibility/AudioBackendCompatibility.csproj `
            -r win-x64 --self-contained true -p:WarningLevel=0 -o "$env:RUNNER_TEMP\audio-win"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-audio-host
          path: ${{ runner.temp }}/audio-win
          if-no-files-found: ignore

  macos:
    name: macOS (Metal and CoreAudio native contracts)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DejaGnu and shader tooling
        run: brew install dejagnu spirv-cross glslang

      - name: Native Metal and CoreAudio contract
        run: dotnet run --project tests/NativeApiCompatibility/NativeApiCompatibility.csproj -p:WarningLevel=0

      - name: Metal shader translation from the actual game sources
        run: dotnet run --project tests/MetalCompatibility/MetalCompatibility.csproj -p:WarningLevel=0

      - name: Behaviour suites
        shell: bash
        run: sh tools/run-behavior-regressions.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-reports
          path: |
            /tmp/tmp.*/**/*.sum
            /tmp/tmp.*/**/*.log
          if-no-files-found: ignore

  wine:
    name: Wine (Windows XAudio2 contract parity)
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-audio-host
          path: ${{ runner.temp }}/audio-win

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32:i386
          mkdir -p "$RUNNER_TEMP/wine-prefix"

      - name: Wine native XAudio2 contract
        env:
          WINEPREFIX: ${{ runner.temp }}/wine-prefix
          WINEDEBUG: "-all"
          THSSS_AUDIO_BACKEND: xaudio2
        run: wine "$RUNNER_TEMP/audio-win/AudioBackendCompatibility.exe"
